<app-page-wrapper [gridClass]="'col-sm-12'" [title]="'roles'">
    <div button>
        <app-a-button [text]="'global_new'" [icon]="'add'" [link]="'/roles/create'" ></app-a-button>
    </div>
    <app-table 
        [tableConfig]="tableConfig"
        [hasCheckbox]="false"
        [topbar]="false"
        (tableChanged)="onTableChange($event)"

        >
    </app-table>
</app-page-wrapper>
